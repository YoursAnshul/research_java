<div class="flex items-center justify-between mb-4">
  <div class="flex items-center">
    <div class="min-w-[225px] pr-4 py-1">
      <app-select id="status-filter" [fieldLabel]="'User Role (for Core Hr. Totals)'" [dropDownValues]="dropDownValues"
        [selectedValues]="selectedValues" (selectedValuesChange)="userRoleChange($event)">
      </app-select>
    </div>
  </div>
  <div class="flex space-x-2">
    <button (click)="saveCoreHours()"
      class="bg-blue-400 hover:bg-blue-500 text-white font-semibold px-6 py-2 rounded shadow border-2 border-blue-400">

      Save
    </button>
    <button
      class="bg-white border border-blue-400 text-blue-500 font-semibold px-6 py-2 rounded shadow border-2 border-blue-400">
      Export
    </button>
  </div>
</div>

<div class="overflow-x-auto border border-blue-600">
  <table class="text-black min-w-full text-s border-separate border-spacing-0">
    <thead>
      <tr class="bg-[#E7F3FA] border border-blue-600">
        <th class="text-left px-2 py-1 border-r border-b border-blue-600 font-semibold w-48 whitespace-nowrap">
          User (hrs. per week)
        </th>
        <th *ngFor="let month of monthsHeader"
          class="text-center px-2 py-1 border-r border-b border-blue-600 font-semibold">
          {{ month }}
        </th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let res of paginatedList" class="bg-white">
        <td class="px-2 py-1 border">
          {{ res.fname }} {{ res.lname }}
        </td>
        <td *ngFor="let month of monthsHeader; index as i" class="px-3 py-2 border text-center">
          <input class="w-12 py-2 border border-blue-600 rounded text-center bg-white" [value]="getCoreHour(res, i)"
            (input)="onCoreHourChange($event, monthKeys[i], res)" />

        </td>
      </tr>

      <tr class="bg-[#E7F3FA] border border-blue-600">
        <td class="p-2 border-r border-t border-b border-blue-600 font-bold whitespace-nowrap">
          User Core Hr. Totals
        </td>
        <td *ngFor="let total of totalCoreHours"
          class="p-2 border-r border-t border-b border-blue-600 text-center font-bold">
          {{ total }}
        </td>
      </tr>
    </tbody>
  </table>

  <app-table-paginator [sourceData]="list" [(currentPage)]="currentPage" [(paginatedData)]="paginatedList"
    (pageChange)="onPageChanged()" class="custom-paginator"></app-table-paginator>
</div>
