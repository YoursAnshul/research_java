<div class="dialog-container">
  <div class="dialog-header">
    <span class="icon-warning">!</span>
  </div>
  <h2 class="dialog-title">Are you sure you want to leave this page?</h2>
  <p class="dialog-message">
    Any unsaved changes will be discarded.
  </p>
  <div class="dialog-actions">
    <button mat-flat-button class="w-100 primary-button" (click)="onCancel()">
      Go Back
    </button>
    <button mat-flat-button class="w-100 warn-button" (click)="onConfirm()">
      Discard Changes
    </button>
  </div>
</div>
