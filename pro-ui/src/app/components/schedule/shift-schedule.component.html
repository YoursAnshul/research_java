<div
  class="d-flex align-items-center justify-content-between"
  style="padding: 10px 15px"
>
  <h2 style="color: #0680cd; margin: 0">Add Shift Schedule</h2>

  <div class="d-flex" style="margin-left: auto">
    <button
      style="height: 25px"
      mat-raised-button
      color="primary"
      class="submit wd90"
      (click)="saveSchedule()"
    >
      Save Calendar
    </button>
    <button
      style="height: 25px"
      class="btn-outline ml-2"
      (click)="confirmatationClose()"
    >
      Close
    </button>
  </div>
</div>

<div style="margin-left: 15px; margin-right: 15px">
  <form [formGroup]="shiftForm" (ngSubmit)="onSubmit()">
    <div class="form-container">
      <div>
        <!-- User Dropdown -->
        <mat-form-field
          appearance="outline"
          class="custom-form-field"
          style="width: 185px"
        >
          <mat-label>User</mat-label>
          <mat-select
            formControlName="user"
            [(value)]="selectedUser"
            (selectionChange)="onUserSelectionChange($event)"
          >
            <mat-option *ngFor="let user of userList" [value]="user">
              {{ user.userName }}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <!-- Project Multi-select -->
        <mat-form-field
          appearance="outline"
          class="custom-form-field ml-2"
          style="width: 185px"
        >
          <mat-label>Project</mat-label>
          <mat-select formControlName="projects" [(value)]="selectedProject">
            
            <!-- Other Projects -->
            <mat-optgroup label="Projects">
              <mat-option
                *ngFor="let project of otherProjects"
                [value]="project"
              >
                {{ project.projectName }}
              </mat-option>
            </mat-optgroup>

            <!-- Admin Projects -->
            <mat-optgroup label="Admin">
              <mat-option
                *ngFor="let project of adminProjects"
                [value]="project"
              >
                {{ project.projectName }}
              </mat-option>
            </mat-optgroup>
          </mat-select>
        </mat-form-field>

        <!-- Current Day Display -->
        <span class="ml-2">{{ currentDay }}</span>

        <!-- Day Wise Date Picker -->
        <mat-form-field
          appearance="outline"
          class="custom-form-field ml-2"
          style="width: 170px"
        >
          <mat-label>{{ currentDay }}</mat-label>
          <input
            matInput
            [matDatepicker]="dayWisePicker"
            formControlName="dayWiseDate"
          />
          <mat-datepicker-toggle
            matSuffix
            [for]="dayWisePicker"
          ></mat-datepicker-toggle>
          <mat-datepicker #dayWisePicker></mat-datepicker>
        </mat-form-field>
        <!-- Start Time Picker -->
        <mat-form-field
          appearance="outline"
          class="custom-form-field ml-2"
          [class.error-border]="
            shiftForm.get('startTime')?.hasError('duplicate')
          "
          style="width: 80px"
        >
          <mat-label>Start Time</mat-label>
          <mat-select
            formControlName="startTime"
            [disabled]="!!shiftForm.get('startTime')?.disabled"
          >
            <mat-option *ngFor="let time of timeSlots" [value]="time">
              <div
                class="time-box"
                [ngStyle]="{
                  'background-color': getBackgroundColor(time)
                }"
              >
                {{ time }}
              </div>
            </mat-option>
          </mat-select>
        </mat-form-field>

        <!-- End Time Picker -->
        <mat-form-field
          appearance="outline"
          class="custom-form-field ml-2"
          [class.error-border]="shiftForm.get('endTime')?.hasError('duplicate')"
          style="width: 80px"
        >
          <mat-label>End Time</mat-label>
          <mat-select
            formControlName="endTime"
            [disabled]="!!shiftForm.get('endTime')?.disabled"
          >
            <mat-option *ngFor="let time of endtimeSlots" [value]="time">
              <div
                class="time-box"
                [ngStyle]="{
                  'background-color': getBackgroundColor(time)
                }"
              >
                {{ time }}
              </div>
            </mat-option>
          </mat-select>
        </mat-form-field>

        <!-- Dynamic Duration Display -->
        <span class="ml-2">{{ duration }}</span>

        <!-- Comments (Optional) -->
        <mat-form-field
          appearance="outline"
          class="custom-form-field ml-2"
          style="width: 150px"
        >
          <mat-label>Comments</mat-label>
          <input matInput formControlName="comments" />
        </mat-form-field>

        <!-- Add to Calendar Button -->
        <div class="ml-1 mr-1" *ngIf="!isEdit">
          <button
            mat-raised-button
            color="primary"
            [disabled]="
              !scheduleFetchStatus ||
              !this.shiftForm.get('startTime')?.value ||
              !this.shiftForm.get('endTime')?.value
            "
          >
            <mat-icon>add</mat-icon> Add to Calendar
          </button>
        </div>
        <!-- <div class="icon-container" *ngIf="isEdit" style="cursor: pointer;">
          <mat-icon (click)="editSchedule()">edit</mat-icon>
        </div> -->
         </div>
    </div>

    <!-- Shift Calendar Component -->
    <app-shift-calendar
      style="margin-top: -20px"
      (resetShiftSchedule)="onResetShiftSchedule()"
      (selectedUserChange)="handleUser($event)"
      (selectedProjectChange)="handleProject($event)"
      (selectedDateRangeValue)="onDateRangeReceived($event)"
      (tabValue)="onTabValueReceived($event)"
      (seletedDayDate)="onSeletedDayDate($event)"
      (sendDate)="handleDate($event)"
      (sendWeekDate)="handleWeekDate($event)"
      [shiftSchedule1]="shiftSchedule"
      [changeDate]="changeDate"
      [homeUser]="homeUser"
      [homeSelectedProject]="homeSelectedProject"
      [homeSelectedDate]="homeSelectedDate"
      [tab]="tab"
    >
      > ></app-shift-calendar
    >
  </form>
</div>
