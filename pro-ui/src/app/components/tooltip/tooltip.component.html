<span (mouseenter)="showTooltip($event)"
  (mouseleave)="hideTooltip()"
  (mousemove)="moveTooltip($event)"
  class="relative inline-block">
  <ng-content></ng-content>
</span>
<div *ngIf="show" [ngStyle]="tooltipStyle" class="fixed z-50 px-3 py-2 rounded text-xs text-white bg-gray-700 shadow-lg whitespace-nowrap pointer-events-none transition-opacity duration-150"
[ngClass]="{
  'opacity-100': show,
  'opacity-0': !show
}">
  <div
    class="absolute w-3 h-3"
    [ngClass]="{
      'left-[40%] -translate-x-1/2 top-3/4 mt-0.5 rotate-180': position === 'top',
      'left-1/2 -translate-x-1/2 top-0 -mt-1 rotate-0': position === 'bottom',
      'left-0 top-1/3 -translate-y-1/2 -ml-1 -rotate-90': position === 'right',
      'right-0 top-1/3 -translate-y-1/2 -mr-1 rotate-90': position === 'left'
    }"
    style="z-index:51;"
  >
    <div class="w-3 h-3 bg-gray-700 rotate-45"></div>
  </div>
  {{ text }}
</div>
