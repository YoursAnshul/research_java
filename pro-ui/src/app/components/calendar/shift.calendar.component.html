<div id="calendar-container">
  <!--refresh-->
  <div id="refresh-calendar-container">
    <svg
      id="refresh-calendar"
      (click)="getAllUserSchedulesByAnchorDateNew()"
      [class.spin]="scheduleFetchStatus"
      xmlns="http://www.w3.org/2000/svg"
      width="25"
      fill="green"
      class="bi bi-arrow-repeat"
      viewBox="0 0 16 16"
    >
      <path
        d="M11.534 7h3.932a.25.25 0 0 1 .192.41l-1.966 2.36a.25.25 0 0 1-.384 0l-1.966-2.36a.25.25 0 0 1 .192-.41zm-11 2h3.932a.25.25 0 0 0 .192-.41L2.692 6.23a.25.25 0 0 0-.384 0L.342 8.59A.25.25 0 0 0 .534 9z"
      ></path>
      <path
        fill-rule="evenodd"
        d="M8 3c-1.552 0-2.94.707-3.857 1.818a.5.5 0 1 1-.771-.636A6.002 6.002 0 0 1 13.917 7H12.9A5.002 5.002 0 0 0 8 3zM3.1 9a5.002 5.002 0 0 0 8.757 2.182.5.5 0 1 1 .771.636A6.002 6.002 0 0 1 2.083 9H3.1z"
      ></path>
    </svg>

    <span id="refresh-calendar-message" class="italic">{{
      scheduleFetchMessage
    }}</span>
  </div>
  <mat-tab-group
    [(selectedIndex)]="tabIndex"
    (selectedTabChange)="onTabChanged($event)"
  >
    <mat-tab label="Day" [disabled]="isLoading || isWeekTabDisabled">
      <div class="calendar-wrapper">
        <div
          [ngClass]="authenticatedUser?.role == UserRoles.Interviewer ? 'wd100' : 'wd100'"
          class="calendar-control-container center-container"
        >
          <app-shift-calendar-controls
            id="day-calendar-controls"
            [_selectedDate]="selectedDate"
            (selectedDateChange)="getAllUserSchedulesByAnchorDate()"
            [_calendarType]="'DAY'"
            [isClose]="isClose"
          >
          </app-shift-calendar-controls>
        </div>
      </div>
      <div class="center-container" *ngIf="authenticatedUser?.role !== UserRoles.Interviewer">
        <div>
          <div class="min-w-[200px]">
          <app-select
            id="user_filter"
            [fieldLabel]="'Users'"
            [anyLabel]="'Users'"
            [multiSelect]="false"
            [isFlag]="true"
            [dropDownValues]="userDropDownValues"
            (selectedValuesChange)="onUserChange($event)"
            [(anyValueSelected)]="anyUserValueSelected"
            [selectedValues]="selectedUserValues"
            [width]="'200px'">
          </app-select>
        </div>
        </div>
        <div class="ml-3">
          <div class="min-w-[200px]">
          <app-select
            id="project_filter"
            [fieldLabel]="'Projects'"
            [anyLabel]="'Projects'"
            [multiSelect]="false"
            [isFlag]="true"
            [dropDownValues]="projectDropDownValues"
            (selectedValuesChange)="onProjectChange($event)"
            [(anyValueSelected)]="anyProjectValueSelected"
            [selectedValues]="selectedProjectValues"
            [width]="'200px'">
          </app-select>
        </div>
        </div>
        <div class="ml-3">
          <button
            type="button"
            style="height: 25px"
            mat-raised-button
            color="primary"
            (click)="onReset()"
          >
            Reset
          </button>
        </div>
      </div>
      <app-shift-day-view
        [shiftSchedule]="shiftSchedule"
        [selectedDate]="selectedDate"
        [selectedUser]="selectedUser"
        [selectedProject]="selectedProject"
        (resetShiftSchedule)="onResetShiftSchedule()"
        (selectedUserChange)="onSelectedUserChange($event)"
        (selectedProjectChange)="onSelectedProjectChange($event)"
        (sendDate)="handleDate($event)"
        (scheduleData)="handleSchedule($event)"
        [isLoading]="isLoading"
        [pId]="pId"
        [isScheduleUpdate]="isScheduleUpdate"
      >
      </app-shift-day-view>
    </mat-tab>
    <mat-tab label="Week" [disabled]="isLoading || isWeekTabDisabled">
      <div class="calendar-wrapper">
        <div
          [ngClass]="authenticatedUser?.role == UserRoles.Interviewer ? 'wd100' : 'wd100'"
          class="calendar-control-container center-container"
        >
          <app-shift-calendar-controls
            id="week-calendar-controls"
            [_selectedDate]="selectedDate"
            [selectedDateRange]="selectedDateRange"
            (selectedDateChange)="getAllUserSchedulesByAnchorDate()"
            [_calendarType]="'WEEK'"
            [isClose]="isClose"
          >
          </app-shift-calendar-controls>
        </div>
      </div>
      <div
        class="center-container mb-3"
        *ngIf="authenticatedUser?.role !== UserRoles.Interviewer"
      >
       <div class="min-w-[200px]">
          <app-select
            id="user_filter"
            [fieldLabel]="'Users'"
            [anyLabel]="'Users'"
            [multiSelect]="false"
            [isFlag]="true"
            [dropDownValues]="userDropDownValues"
            (selectedValuesChange)="onUserChange($event)"
            [(anyValueSelected)]="anyUserValueSelected"
            [selectedValues]="selectedUserValues"
            [width]="'200px'">
          </app-select>
        </div>
        <div class="ml-3">
          <div class="min-w-[200px]">
          <app-select
            id="project_filter"
            [fieldLabel]="'Projects'"
            [anyLabel]="'Projects'"
            [multiSelect]="false"
            [isFlag]="true"
            [dropDownValues]="projectDropDownValues"
            (selectedValuesChange)="onProjectChange($event)"
            [(anyValueSelected)]="anyProjectValueSelected"
            [selectedValues]="selectedProjectValues"
            [width]="'200px'">
          </app-select>
          </div>
        </div>
        <div class="ml-3">
          <button
            type="button"
            style="height: 25px"
            mat-raised-button
            color="primary"
            (click)="onReset()"
          >
            Reset
          </button>
        </div>
      </div>
      <app-shift-week-view-v2
        [shiftSchedule]="shiftSchedule"
        [selectedDate]="selectedDate"
        [selectedDateRange]="selectedDateRange"
        [selectedUser]="selectedUser"
        [selectedProject]="selectedProject"
        (resetShiftSchedule)="onResetShiftSchedule()"
        (sendWeekDate)="handleWeekDate($event)"
        (scheduleData)="handleSchedule($event)"
        [isLoading]="isLoading"
        [pId]="pId"
        [isScheduleUpdate]="isScheduleUpdate"
      ></app-shift-week-view-v2>
    </mat-tab>
    <mat-tab label="Month" [disabled]="isLoading || isWeekTabDisabled">
      <div class="calendar-wrapper">
        <div
          [ngClass]="authenticatedUser?.role == UserRoles.Interviewer ? 'wd100' : 'wd100'"
          class="calendar-control-container center-container"
        >
          <app-shift-calendar-controls
            id="month-calendar-controls"
            [_selectedDate]="selectedDate"
            [_calendarType]="'MONTH'"
            (selectedDateChange)="getAllUserSchedulesByAnchorDate()"
            [isClose]="isClose"
          >
          </app-shift-calendar-controls>
        </div>
      </div>
      <div
        class="center-container mb-3"
        *ngIf="authenticatedUser?.role !== UserRoles.Interviewer"
      >
        <div class="min-w-[200px]">
          <app-select
            id="user_filter"
            [fieldLabel]="'Users'"
            [anyLabel]="'Users'"
            [multiSelect]="false"
            [isFlag]="true"
            [dropDownValues]="userDropDownValues"
            (selectedValuesChange)="onUserChange($event)"
            [(anyValueSelected)]="anyUserValueSelected"
            [selectedValues]="selectedUserValues"
            [width]="'200px'">
          </app-select>
        </div>
        <div class="ml-3">
          <div class="min-w-[200px]">
          <app-select
            id="project_filter"
            [fieldLabel]="'Projects'"
            [anyLabel]="'Projects'"
            [multiSelect]="false"
            [isFlag]="true"
            [dropDownValues]="projectDropDownValues"
            (selectedValuesChange)="onProjectChange($event)"
            [(anyValueSelected)]="anyProjectValueSelected"
            [selectedValues]="selectedProjectValues"
            [width]="'200px'">
          </app-select>
        </div>
        </div>
        <div class="ml-3">
          <button
            type="button"
            style="height: 25px"
            mat-raised-button
            color="primary"
            (click)="onReset()"
          >
            Reset
          </button>
        </div>
      </div>
      <app-shift-month-view
        [monthSchedules]="monthSchedules"
        [shiftSchedule]="shiftSchedule"
        [selectedDate]="selectedDate"
        [selectedDateRange]="selectedDateRange"
        [selectedUser]="selectedUser"
        [selectedProject]="selectedProject"
        (resetShiftSchedule)="onResetShiftSchedule()"
        (monthDate)="handleWeekDate($event)"
        (scheduleData)="handleSchedule($event)"
        [isLoading]="isLoading"
        [pId]="pId"
        [isScheduleUpdate]="isScheduleUpdate"
      ></app-shift-month-view>
    </mat-tab>
  </mat-tab-group>
</div>

<style>
  ::ng-deep .mdc-tab__text-label {
    font-size: 12px !important;
  }
</style>
