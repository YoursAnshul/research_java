<div id="week-calendar" style="background-color: #f2f2f2 !important">
  <div id="week-calendar-header"></div>

  <!-- Time Header -->
  <div id="week-calendar-time-header" class="week-calendar-time-header">
    <div
      *ngFor="let day of ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday']; let i = index"
      [ngStyle]="{
        width: '14.14%',
        'background-color': 'lightgoldenrodyellow',
        color: 'black'
      }"
      (dblclick)="openUserSchedule(null, null, GetDaysDateAsDate(weekSchedules?.weekStart, i + 1), 1)"
    >
      {{ day }} {{ GetDaysDate(weekSchedules?.weekStart, i + 1) }}
    </div>

    <div
      *ngIf="authenticatedUser?.interviewer"
      [ngStyle]="{
        width: '7%',
        'background-color': '#0078d4',
        color: 'white'
      }"
    >
      Total
    </div>
  </div>

  <!-- Add Icons and Hour Inputs -->
  <div id="week-calendar-add-icons" class="week-calendar-add-icons">
    <div
      *ngFor="let day of ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday']; let i = index"
      [ngStyle]="{
        width: '14.14%',
        display: 'flex',
        justifyContent: 'center',
        alignItems: 'center',
        gap: '8px'
      }"
    >
      <mat-icon
        style="cursor: pointer; color: #0078d4"
        (click)="addShift(GetDaysDateAsDate(weekSchedules?.weekStart, i + 1))"
      >
        add
      </mat-icon>
    </div>

    <div
      *ngIf="authenticatedUser?.interviewer"
      [ngStyle]="{
        width: '7%',
        justifyContent: 'center',
        alignItems: 'center',
        height: '30px'
      }"
    >
      <input
        id="week-calendar-user-schedules"
        type="text"
        [value]="calculateTotalDuration() + ' hr'"
        class="right-aligned-input"
        [style.height]="inputHeight"
        [readonly]="true"
        disabled="true"
      />
    </div>
  </div>

  <!-- User Schedules -->
  <div *ngIf="hasSchedules(); else noSchedules" id="week-calendar-user-schedules">
    <div
      *ngFor="let daySchedules of [
        weekSchedules?.day1Schedules,
        weekSchedules?.day2Schedules,
        weekSchedules?.day3Schedules,
        weekSchedules?.day4Schedules,
        weekSchedules?.day5Schedules,
        weekSchedules?.day6Schedules,
        weekSchedules?.day7Schedules
      ]; let dayIndex = index"
      [ngClass]="authenticatedUser?.interviewer ? 'day-schedules-container-interviewer' : 'day-schedules-container'"
    >
      <ng-container *ngFor="let schedule of daySchedules">
        <div
          class="schedule-card"
          (mouseenter)="displayHoverMessage($event, schedule)"
          (mouseleave)="hideHoverMessage()"
        >
          <div class="center-align-container">
            <app-project-swatch [projectColor]="schedule.projectColor"></app-project-swatch>
            <div>
              <div class="bold">{{ schedule.displayName }}:</div>
              <div class="project-time">
                {{ schedule.startTime }} - {{ schedule.endTime }}
              </div>
              <div class="project-time">
                <div class="duration-circle">{{ schedule.duration }} hr</div>
              </div>
            </div>
          </div>
        </div>
      </ng-container>
    </div>
  </div>

  <!-- Display "No schedules found" message if no schedules -->
  <ng-template #noSchedules>
    <div class="user-schedule-row no-results bold italic" 
         style="text-align: center; padding: 10px; ">
      No schedules found for this date range...
    </div>
  </ng-template>

</div>

<div
  *ngIf="showTooltip"
  class="custom-tooltip"
  [ngStyle]="tooltipPosition"
  [innerHTML]="tooltipMessage"
></div>

<app-hover-message [hoverMessage]="hoverMessage"></app-hover-message>
