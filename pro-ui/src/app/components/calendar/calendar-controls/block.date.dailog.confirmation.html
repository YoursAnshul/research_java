<div class="dialog-container">
  <div class="dialog-header">
    <span class="icon-warning">!</span>
  </div>
  <h2 class="dialog-title">The shift falls on a blocked date. Do you want to continue?</h2>
  <div class="dialog-actions">
    <button mat-flat-button class="w-100 primary-button" (click)="onConfirm()">
     Proceed
    </button>
    <button mat-flat-button class="w-100 warn-button" (click)="onCancel()">
      Discard Changes
    </button>
  </div>
</div>
