<div class="dialog-container">
  <div class="dialog-header">
    <span class="icon-warning">!</span>
  </div>
  <h2 class="dialog-title">The shift is on a block date.</h2>
  <h2 class="dialog-title">This selected time is blocked.</h2>
  <div class="dialog-actions">
    <button mat-flat-button class="w-100 primary-button" (click)="onConfirm()">
      continue
    </button>
    <button mat-flat-button class="w-100 warn-button" (click)="onCancel()">
      Cancel
    </button>
  </div>
</div>
